[package]
name = "simple_rust_api"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "simple_rust_api"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", optional = true }
tokio = { version = "1.0", features = ["full"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = { version = "0.15", optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-native-tls", "postgres", "macros", "chrono"], optional = true }
leptos = { version = "0.7" }
leptos_router = { version = "0.7" }
leptos_axum = { version = "0.7", optional = true }
tower-http = { version = "0.5", features = ["fs"], optional = true }
web-sys = { version = "0.3", features = ["HtmlFormElement", "FormData"] }
wasm-bindgen = { version = "0.2" }
console_error_panic_hook = "0.1"


[features]
default = ["ssr"]

ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:dotenvy",
    "dep:sqlx",
    "dep:leptos_axum",
    "dep:tower-http",
    "leptos/ssr",
]

hydrate = [
    "leptos/hydrate",
]


[package.metadata.leptos]
#output-name = "simple_rust_api"
#site-root = "target/site"
#site-pkg-dir = "pkg"
#site-addr = "127.0.0.1:3000"
#reload-port = 3001
bin-target = "simple_rust_api"

# Путь к исходному CSS-файлу с директивами Tailwind
tailwind-input-file = "style/main.css"

# Имя проекта для генерации файлов
output-name = "simple_rust_api"
# Папка, куда будет собираться проект
site-root = "target/site"
# Папка для статики внутри site-root
site-pkg-dir = "pkg"
# Адрес и порт сервера
site-addr = "127.0.0.1:3000"
# Порт для hot-reload
reload-port = 3001
# Указываем, какие фичи включать для сервера (SSR) и для WASM-клиента (Hydrate)
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
